name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run tests
        run: go test -v -race ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build binaries
        run: |
          GOOS=linux  GOARCH=amd64 go build -o dist/autopull_linux_amd64  .
          GOOS=linux  GOARCH=arm64 go build -o dist/autopull_linux_arm64  .
          GOOS=darwin GOARCH=amd64 go build -o dist/autopull_darwin_amd64 .
          GOOS=darwin GOARCH=arm64 go build -o dist/autopull_darwin_arm64 .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build and package release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # Plain binaries (used by the curl installer)
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%%/*}"
            arch="${target##*/}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -ldflags="${LDFLAGS}" \
              -o "dist/autopull_${os}_${arch}" .
          done

          # Linux bundles: binary + packaging scripts in a tar.gz
          # (used by packaging/linux/install.sh for full system installs)
          for arch in amd64 arm64; do
            bundle="auto_pull_linux_${arch}_${VERSION}"
            mkdir -p "dist/${bundle}"
            cp "dist/autopull_linux_${arch}"              "dist/${bundle}/auto_pull"
            cp packaging/linux/install.sh                 "dist/${bundle}/"
            cp packaging/linux/uninstall.sh               "dist/${bundle}/"
            cp packaging/linux/auto_pull.service          "dist/${bundle}/"
            cp packaging/linux/config_auto_pull.example.json "dist/${bundle}/"
            chmod +x "dist/${bundle}/auto_pull" \
                     "dist/${bundle}/install.sh" \
                     "dist/${bundle}/uninstall.sh"
            tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
          done

          # Checksums for all uploaded artifacts
          (cd dist && sha256sum \
            "autopull_linux_amd64" \
            "autopull_linux_arm64" \
            "autopull_darwin_amd64" \
            "autopull_darwin_arm64" \
            "auto_pull_linux_amd64_${VERSION}.tar.gz" \
            "auto_pull_linux_arm64_${VERSION}.tar.gz" \
            > sha256sums.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/autopull_linux_amd64
            dist/autopull_linux_arm64
            dist/autopull_darwin_amd64
            dist/autopull_darwin_arm64
            dist/auto_pull_linux_amd64_${{ github.ref_name }}.tar.gz
            dist/auto_pull_linux_arm64_${{ github.ref_name }}.tar.gz
            dist/sha256sums.txt
          generate_release_notes: true
